<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Legal Pro — Sistema Legal Inteligente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --ink-blue: #1B365D;
            --corporate-blue: #2F5496;
            --success-green: #548235;
            --warning-yellow: #FFC000;
            --alert-red: #C00000;
            --bg-warm: #faf8f0;
            --bg-white: #ffffff;
            --text-primary: #1a1a18;
            --text-secondary: #5a5a56;
            --border-light: #e0ddd5;
            --shadow: 0 2px 8px rgba(27, 54, 93, 0.12);
            --shadow-hover: 0 4px 16px rgba(27, 54, 93, 0.18);
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-warm);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: var(--ink-blue);
            color: white;
            padding: 24px 16px;
            overflow-y: auto;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 24px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--warning-yellow);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .logo-text span {
            font-size: 11px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .nav-section {
            margin-bottom: 24px;
        }
        
        .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
            margin-bottom: 8px;
            padding-left: 12px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-bottom: 2px;
        }
        
        .nav-item:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .nav-item.active {
            background: var(--corporate-blue);
        }
        
        .nav-item .icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        
        .nav-badge {
            margin-left: auto;
            background: var(--alert-red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        /* ── Main Content ── */
        .main {
            margin-left: 260px;
            padding: 24px 32px;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--ink-blue);
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--ink-blue);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--corporate-blue);
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        
        .btn-secondary {
            background: white;
            color: var(--ink-blue);
            border: 1px solid var(--border-light);
        }
        
        .btn-secondary:hover {
            background: var(--bg-warm);
        }
        
        /* ── KPI Cards ── */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }
        
        .kpi-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        
        .kpi-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--ink-blue);
        }
        
        .kpi-delta {
            font-size: 12px;
            margin-top: 4px;
        }
        
        .kpi-delta.positive { color: var(--success-green); }
        .kpi-delta.negative { color: var(--alert-red); }
        
        .kpi-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        /* ── Section Cards ── */
        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .section-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .section-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink-blue);
        }
        
        .section-header a {
            font-size: 12px;
            color: var(--corporate-blue);
            text-decoration: none;
        }
        
        /* ── Alert Items ── */
        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--bg-warm);
            border-left: 3px solid var(--warning-yellow);
        }
        
        .alert-item.urgente {
            border-left-color: var(--alert-red);
            background: #fff5f5;
        }
        
        .alert-item.completada {
            border-left-color: var(--success-green);
            opacity: 0.6;
        }
        
        .alert-icon {
            font-size: 18px;
        }
        
        .alert-content {
            flex: 1;
        }
        
        .alert-title {
            font-weight: 600;
            font-size: 13px;
        }
        
        .alert-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        /* ── Matter Rows ── */
        .matter-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: var(--bg-warm);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .matter-row:hover {
            background: #f0ede5;
        }
        
        .matter-priority {
            width: 4px;
            height: 40px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        
        .priority-alta { background: var(--alert-red); }
        .priority-media { background: var(--warning-yellow); }
        .priority-baja { background: var(--success-green); }
        
        .matter-info {
            flex: 1;
        }
        
        .matter-cliente {
            font-weight: 600;
            font-size: 14px;
        }
        
        .matter-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        .matter-deadline {
            text-align: right;
            flex-shrink: 0;
        }
        
        .matter-dias {
            font-size: 20px;
            font-weight: 700;
            color: var(--alert-red);
        }
        
        .matter-dias.safe {
            color: var(--success-green);
        }
        
        .matter-dias-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        /* ── Reunion Cards ── */
        .reunion-card {
            padding: 16px;
            border-radius: 8px;
            background: var(--bg-warm);
            margin-bottom: 10px;
            border-left: 3px solid var(--corporate-blue);
        }
        
        .reunion-card.procesada {
            border-left-color: var(--success-green);
        }
        
        .reunion-card.pendiente {
            border-left-color: var(--warning-yellow);
        }
        
        .reunion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .reunion-cliente {
            font-weight: 600;
            font-size: 14px;
        }
        
        .reunion-fecha {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .reunion-resumen {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        .reunion-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .btn-small {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        .btn-doc {
            background: var(--ink-blue);
            color: white;
        }
        
        .btn-view {
            background: white;
            color: var(--ink-blue);
            border: 1px solid var(--border-light);
        }
        
        /* ── Documento Items ── */
        .doc-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            background: var(--bg-warm);
            margin-bottom: 6px;
        }
        
        .doc-icon {
            font-size: 24px;
        }
        
        .doc-info {
            flex: 1;
        }
        
        .doc-nombre {
            font-weight: 600;
            font-size: 13px;
        }
        
        .doc-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .doc-estado {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .estado-borrador {
            background: var(--warning-yellow);
            color: #5a4a00;
        }
        
        .estado-revision {
            background: #e3f2fd;
            color: var(--corporate-blue);
        }
        
        .estado-firmado {
            background: #e8f5e9;
            color: var(--success-green);
        }
        
        /* ── Status Badge ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-activo {
            background: #e8f5e9;
            color: var(--success-green);
        }
        
        .status-intake {
            background: #fff3e0;
            color: #e65100;
        }
        
        .status-cerrado {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        
        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        
        /* ── Full Width Section ── */
        .full-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        
        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-light);
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: var(--ink-blue);
        }
        
        .tab.active {
            color: var(--ink-blue);
            border-bottom-color: var(--ink-blue);
        }
        
        /* ── Form ── */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--corporate-blue);
            box-shadow: 0 0 0 3px rgba(47, 84, 150, 0.1);
        }
        
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        
        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--ink-blue);
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        
        /* ── Responsive ── */
        @media (max-width: 1200px) {
            .kpi-grid { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .main { margin-left: 200px; padding: 16px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .section-grid { grid-template-columns: 1fr; }
        }
        
        /* ── Loading ── */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-light);
            border-top-color: var(--ink-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ── Hidden ── */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">⚖️</div>
            <div class="logo-text">
                <h1>Hermes Legal</h1>
                <span>Pro v1.0</span>
            </div>
        </div>
        
        <div class="nav-section">
            <div class="nav-label">Principal</div>
            <div class="nav-item active" data-view="dashboard" onclick="showView('dashboard')">
                <span class="icon">📊</span>
                <span>Dashboard</span>
            </div>
            <div class="nav-item" data-view="reuniones" onclick="showView('reuniones')">
                <span class="icon">🎤</span>
                <span>Reuniones</span>
                <span class="nav-badge" id="badge-reuniones">0</span>
            </div>
            <div class="nav-item" data-view="matters" onclick="showView('matters')">
                <span class="icon">📁</span>
                <span>Casos (Matters)</span>
                <span class="nav-badge" id="badge-matters">0</span>
            </div>
            <div class="nav-item" data-view="documentos" onclick="showView('documentos')">
                <span class="icon">📄</span>
                <span>Documentos</span>
            </div>
        </div>
        
        <div class="nav-section">
            <div class="nav-label">Gestión</div>
            <div class="nav-item" data-view="calendario" onclick="showView('calendario')">
                <span class="icon">📅</span>
                <span>Calendario</span>
            </div>
            <div class="nav-item" data-view="clientes" onclick="showView('clientes')">
                <span class="icon">👥</span>
                <span>Clientes</span>
            </div>
            <div class="nav-item" data-view="admin" onclick="showView('admin')">
                <span class="icon">⚙️</span>
                <span>Administración</span>
            </div>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main" id="main-content">
        <!-- Views will be rendered here -->
    </main>
    
    <script>
        // ── State ──
        let currentView = 'dashboard';
        let matters = [];
        let reuniones = [];
        let documentos = [];
        let alertas = [];
        let templates = [];
        
        const API_BASE = window.location.origin + '/api';
        
        // ── Init ──
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
        });
        
        // ── Navigation ──
        function showView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-view="${view}"]`).classList.add('active');
            
            switch(view) {
                case 'dashboard': loadDashboard(); break;
                case 'reuniones': loadReuniones(); break;
                case 'matters': loadMatters(); break;
                case 'documentos': loadDocumentos(); break;
                case 'calendario': loadCalendario(); break;
                case 'clientes': loadClientes(); break;
                case 'admin': loadAdmin(); break;
            }
        }
        
        // ── Dashboard ──
        async function loadDashboard() {
            const main = document.getElementById('main-content');
            main.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const res = await fetch(`${API_BASE}/dashboard`);
                const data = await res.json();
                
                main.innerHTML = `
                    <div class="header">
                        <h2>Dashboard</h2>
                        <div class="header-actions">
                            <button class="btn btn-secondary" onclick="showView('reuniones')">
                                🎤 Nueva Reunión
                            </button>
                            <button class="btn btn-primary" onclick="showNuevoMatterModal()">
                                ➕ Nuevo Caso
                            </button>
                        </div>
                    </div>
                    
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="kpi-icon">📁</div>
                            <div class="kpi-label">Casos Activos</div>
                            <div class="kpi-value">${data.kpis.matters_activos}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon">🔥</div>
                            <div class="kpi-label">Urgentes</div>
                            <div class="kpi-value" style="color: var(--alert-red)">${data.kpis.matters_urgentes}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon">🎤</div>
                            <div class="kpi-label">Reuniones Hoy</div>
                            <div class="kpi-value">${data.kpis.reuniones_hoy}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon">📄</div>
                            <div class="kpi-label">Docs Pendientes</div>
                            <div class="kpi-value">${data.kpis.documentos_pendientes}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon">🔔</div>
                            <div class="kpi-label">Alertas</div>
                            <div class="kpi-value" style="color: var(--alert-red)">${data.kpis.alertas_activas}</div>
                        </div>
                    </div>
                    
                    <div class="section-grid">
                        <div class="section-card">
                            <div class="section-header">
                                <h3>⏰ Próximos Plazos</h3>
                                <a href="#" onclick="showView('calendario')">Ver todo →</a>
                            </div>
                            ${data.proximos_plazos.length === 0 ? 
                                '<div class="empty-state">No hay plazos próximos</div>' :
                                data.proximos_plazos.map(p => `
                                    <div class="matter-row" onclick="showMatterDetail('${p.matter_id}')">
                                        <div class="matter-priority ${p.dias_restantes <= 3 ? 'priority-alta' : p.dias_restantes <= 7 ? 'priority-media' : 'priority-baja'}"></div>
                                        <div class="matter-info">
                                            <div class="matter-cliente">${p.cliente}</div>
                                            <div class="matter-meta">${p.descripcion}</div>
                                        </div>
                                        <div class="matter-deadline">
                                            <div class="matter-dias ${p.dias_restantes > 7 ? 'safe' : ''}">${p.dias_restantes}</div>
                                            <div class="matter-dias-label">días</div>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                        
                        <div class="section-card">
                            <div class="section-header">
                                <h3>🎤 Reuniones Recientes</h3>
                                <a href="#" onclick="showView('reuniones')">Ver todo →</a>
                            </div>
                            ${data.reuniones_recientes.length === 0 ?
                                '<div class="empty-state">No hay reuniones recientes</div>' :
                                data.reuniones_recientes.map(r => `
                                    <div class="reunion-card ${r.estado}" onclick="showReunionDetail('${r.id}')">
                                        <div class="reunion-header">
                                            <span class="reunion-cliente">${r.cliente}</span>
                                            <span class="reunion-fecha">${r.fecha}</span>
                                        </div>
                                        <div class="reunion-resumen">${r.resumen || 'Sin resumen'}</div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                    
                    <div class="full-section">
                        <div class="section-header">
                            <h3>🔔 Alertas</h3>
                        </div>
                        ${data.alertas.length === 0 ?
                            '<div class="empty-state">No hay alertas activas</div>' :
                            data.alertas.map(a => `
                                <div class="alert-item ${a.prioridad === 'alta' ? 'urgente' : ''}">

        // ── Matters ──
        async function loadMatters() {
            const main = document.getElementById('main-content');
            main.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const res = await fetch(`${API_BASE}/matters`);
                const data = await res.json();
                matters = data;
                
                document.getElementById('badge-matters').textContent = data.filter(m => m.estado === 'activo').length;
                
                main.innerHTML = `
                    <div class="header">
                        <h2>📁 Casos (Matters)</h2>
                        <button class="btn btn-primary" onclick="showNuevoMatterModal()">
                            ➕ Nuevo Caso
                        </button>
                    </div>
                    
                    <div class="tabs">
                        <button class="tab active" onclick="filterMatters('todos')">Todos</button>
                        <button class="tab" onclick="filterMatters('activo')">Activos</button>
                        <button class="tab" onclick="filterMatters('intake')">Intake</button>
                        <button class="tab" onclick="filterMatters('cerrado')">Cerrados</button>
                    </div>
                    
                    <div class="full-section" id="matters-list">
                        ${renderMattersList(data)}
                    </div>
                `;
            } catch(e) {
                main.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
            }
        }
        
        function renderMattersList(data) {
            if (data.length === 0) {
                return '<div class="empty-state"><div class="icon">📁</div><p>No hay casos registrados</p></div>';
            }
            return data.map(m => `
                <div class="matter-row" onclick="showMatterDetail('${m.id}')">
                    <div class="matter-priority priority-${m.prioridad}"></div>
                    <div class="matter-info">
                        <div class="matter-cliente">${m.cliente}</div>
                        <div class="matter-meta">
                            <span class="status-badge status-${m.estado}">${m.estado}</span>
                            ${m.area_practica} • ${m.next_step || 'Sin next step'}
                        </div>
                    </div>
                    <div class="matter-deadline">
                        ${m.deadline ? `
                            <div class="matter-dias ${calcularDias(m.deadline) > 7 ? 'safe' : ''}">${calcularDias(m.deadline)}</div>
                            <div class="matter-dias-label">días</div>
                        ` : '<div style="font-size: 12px; color: var(--text-secondary);">Sin plazo</div>'}
                    </div>
                </div>
            `).join('');
        }
        
        function filterMatters(estado) {
            const filtered = estado === 'todos' ? matters : matters.filter(m => m.estado === estado);
            document.getElementById('matters-list').innerHTML = renderMattersList(filtered);
        }
        
        function calcularDias(fechaStr) {
            const hoy = new Date();
            const fecha = new Date(fechaStr);
            return Math.ceil((fecha - hoy) / (1000 * 60 * 60 * 24));
        }

                    </div>
                `;
            } catch(e) {
                main.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
            }
        }
